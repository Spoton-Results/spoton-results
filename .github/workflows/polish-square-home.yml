name: Polish Square homepage feature
on:
  push:
    branches: [main]
    paths: ['.github/workflows/polish-square-home.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only the Square homepage section
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re
          p = Path('index.html')
          raw = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert sha == 'd949f8d7717fdd5efad0b7408b332b98910d5e9a', 'Homepage changed; stop for review.'
          s = raw.decode('utf-8')
          replacement = '''
          <section id="square-home-offer" aria-labelledby="square-home-heading">
          <style>
          #square-home-offer{background:#f4f7fc;padding:64px 0;color:#102038;border-bottom:1px solid #dce4ef}#square-home-offer *{box-sizing:border-box}#square-home-offer .sq-panel{display:grid;grid-template-columns:1.1fr 1fr;gap:42px;align-items:center;padding:42px;border:1px solid #243c59;border-radius:26px;background:radial-gradient(ellipse at top left,#203954,#081426 70%);box-shadow:0 20px 55px #0a1a3020}#square-home-offer .sq-label{font:800 11px/1.5 var(--font-b),sans-serif;text-transform:uppercase;letter-spacing:.13em;color:#ffc85c;margin-bottom:18px}#square-home-offer h2{font-family:var(--font-d),sans-serif;font-size:clamp(29px,3.4vw,43px);font-weight:800;line-height:1.15;letter-spacing:-.025em;color:#fff;margin:0 0 20px;max-width:560px}#square-home-offer h2 span{color:#ffc04b}#square-home-offer .sq-copy{font:400 16px/1.8 var(--font-b),sans-serif;color:#d2dfef;max-width:530px;margin:0 0 22px}#square-home-offer .sq-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}#square-home-offer .sq-chips span{font:600 12px/1.5 var(--font-b),sans-serif;color:#e8eff8;border:1px solid #ffffff26;border-radius:30px;padding:7px 11px;background:#ffffff08}#square-home-offer .sq-actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap}#square-home-offer .sq-primary{font:800 14px/1.5 var(--font-b),sans-serif;display:inline-block;padding:15px 22px;border-radius:12px;color:#081426;background:linear-gradient(120deg,#ffb51b,#f59e0b);box-shadow:0 8px 24px #f59e0b26;text-decoration:none;cursor:pointer}#square-home-offer .sq-call{font:600 13px/1.6 var(--font-b),sans-serif;color:#e5edf8;text-decoration:underline;text-underline-offset:4px}#square-home-offer .sq-card{background:white;color:#102038;border-radius:20px;padding:28px;box-shadow:0 12px 30px #0002}#square-home-offer .sq-card-tag{font:800 11px/1.5 var(--font-b),sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#925200;margin:0 0 9px}#square-home-offer .sq-card h3{font:800 23px/1.3 var(--font-b),sans-serif;letter-spacing:-.02em;margin:0 0 18px;color:#102038}#square-home-offer .sq-option{border:1px solid #dce4ef;background:#f7f9fc;border-radius:12px;padding:16px;margin-bottom:12px}#square-home-offer .sq-option strong{display:block;font:750 15px/1.5 var(--font-b),sans-serif;color:#102038;margin-bottom:5px}#square-home-offer .sq-option p{font:400 13px/1.65 var(--font-b),sans-serif;color:#4b5c73;margin:0}#square-home-offer .sq-card-foot{border-top:1px solid #e3e9f1;padding-top:14px;margin-top:18px;font:500 13px/1.7 var(--font-b),sans-serif;color:#4b5c73}#square-home-offer .sq-fine{font:400 12px/1.7 var(--font-b),sans-serif;color:#63728a;margin:16px 4px 0}#square-home-offer a:focus-visible{outline:3px solid #60a5fa;outline-offset:5px}@media(max-width:900px){#square-home-offer .sq-panel{grid-template-columns:1fr;gap:28px;padding:28px}#square-home-offer h2{font-size:clamp(29px,6vw,40px)}}@media(max-width:480px){#square-home-offer{padding:36px 0}#square-home-offer .sq-panel{padding:24px 20px;border-radius:20px}#square-home-offer .sq-card{padding:22px}#square-home-offer .sq-primary{width:100%;text-align:center}}
          </style>
          <div class="con"><div class="sq-panel">
          <div><div class="sq-label">Square for your business</div><h2>Powerful tools.<br><span>A human connection.</span></h2><p class="sq-copy">You have customers to serve, not time to hunt for help. Explore Square with a real contact to talk through your setup, pricing, and support options.</p><div class="sq-chips"><span>Payments &amp; POS</span><span>Setup guidance</span><span>Clear pricing choices</span></div><div class="sq-actions"><a class="sq-primary" href="/square.html">Find my Square setup &rarr;</a><a class="sq-call" href="tel:4358620910">Talk to a real person</a></div></div>
          <aside class="sq-card" aria-label="Square pricing choices"><p class="sq-card-tag">No payment-industry jargon</p><h3>Your business. Your pricing choice.</h3><div class="sq-option"><strong>Keep one price for customers</strong><p>Pay the applicable processing fee when a customer pays by card.</p></div><div class="sq-option"><strong>Offer cash and card prices</strong><p>Use different displayed prices to help offset card-processing costs.</p></div><p class="sq-card-foot">Not sure which fits? Start with a conversation before you choose.</p></aside>
          </div><p class="sq-fine">Explore plan details, pricing, and the support included with your enrollment on our Square page.</p></div></section>
          '''
          pattern = r'<section\b[^>]*\bid="square-home-offer"[^>]*>.*?</section>'
          s, count = re.subn(pattern, lambda m: replacement, s, flags=re.S)
          assert count == 1, 'Expected exactly one Square homepage section.'
          assert s.count('id="square-home-offer"') == 1
          p.write_bytes(s.encode('utf-8'))
      - name: Commit targeted homepage redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Redesign homepage Square feature with focused two-column layout'
          git push origin HEAD:main
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Spoton-Results/spoton-results/pages/builds
